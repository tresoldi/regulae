[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulae"
version = "0.1.0"
description = "Learned sound-correspondence rules for historical-linguistic inference"
authors = [
    {name = "Tiago Tresoldi", email = "tiago.tresoldi@lingfil.uu.se"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "merkmal",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["regulae*"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "ANN", "TC"]
# ANN001/002/003: allow untyped *args/**kwargs in tests (not checked).
# TC001: we prefer eager imports for cycles to surface at import time.
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
# merkmal ships no py.typed marker; suppress that one upstream gap.
# Every other import must still resolve.
ignore_missing_imports = true

[tool.pytest.ini_options]
# Without this the tests import whatever `regulae` the interpreter already has,
# which on a machine holding more than one checkout is not the tree being
# edited: a dedupe added to python/src/regulae/_reconciliation.py did not change
# the result of the test written for it, because the test was exercising another
# clone's copy. Relative to rootdir, so it names this repo's sources.
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
